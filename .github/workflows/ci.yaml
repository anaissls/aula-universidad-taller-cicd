name: 🔎 Code Safety
run-name: Running Code Safety for ${{ github.ref }} on ${{ github.event_name }} 🔎
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  check-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run ruff check .
  check-formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run ruff format .
  check-type-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run pyright
  run-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv run pytest